
name: ObservaNotes CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    name: Build, Test and Publish
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: observa_notes
          POSTGRES_USER: observa_user
          POSTGRES_PASSWORD: observa_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U observa_user -d observa_notes"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_USERNAME: observa_user
      DB_PASSWORD: observa_password

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Compiler et exécuter les tests
        run: ./mvnw clean verify

      - name: Configurer Docker Buildx
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/setup-buildx-action@v3

      - name: Se connecter à Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construire et publier l'image Docker
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/observa-notes:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/observa-notes:${{ github.sha }}

  deploy:
    name: Deploy on Ubuntu WSL
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64]

    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      IMAGE_TAG: ${{ github.sha }}
      APP_DB_USERNAME: ${{ secrets.APP_DB_USERNAME }}
      APP_DB_PASSWORD: ${{ secrets.APP_DB_PASSWORD }}

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Déployer avec Docker Compose
        run: |
          docker compose -f compose.prod.yaml pull
          docker compose -f compose.prod.yaml up -d --remove-orphans