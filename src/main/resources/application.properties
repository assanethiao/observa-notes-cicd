
# Configuration de l'application
spring.application.name=observa-notes

# Configuration de PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/observa_notes
spring.datasource.username=${DB_USERNAME:observa_user}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuration JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Configuration du serveur
server.port=8080

# Configuration Actuator
management.endpoints.web.exposure.include=health,info,prometheus,metrics

# connexion à la base de données PostgreSQL
# $env:DB_USERNAME = "observa_user"
# $env:DB_PASSWORD = "TON_MOT_DE_PASSE"